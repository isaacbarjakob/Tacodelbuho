backend:
  name: github
  repo: isaacbarjakob/Tacodelbuho
  branch: main
  base_url: https://tacodelbuho-admin-auth.isaac-barjakob.workers.dev
  auth_endpoint: /auth
  site_domain: tacodelbuho.pages.dev

site_url: https://tacodelbuho.pages.dev
display_url: https://tacodelbuho.pages.dev
logo_url: https://tacodelbuho.pages.dev/assets/logo.jpg
locale: sv

media_folder: uploads
public_folder: /uploads

collections:
  - name: installningar
    label: Taco del Búho
    files:
      - name: aktuellt
        label: Veckans lunch
        file: content/aktuellt.json
        format: json
        fields:
          - label: Visa sektionen
            name: visible
            widget: boolean
            default: true
          - label: Liten rubrik
            name: kicker
            widget: string
            default: AKTUELLT HOS OSS
          - label: Stor rubrik
            name: title
            widget: string
          - label: Text
            name: text
            widget: text
          - label: Bild
            name: image
            widget: image
            required: false
          - label: Bildbeskrivning
            name: image_alt
            widget: string
            required: false
            hint: Beskriv bilden kort för tillgänglighet och Google.
          - label: Visa knapp
            name: show_button
            widget: boolean
            default: true
          - label: Knapptext
            name: button_text
            widget: string
            required: false
          - label: Knapplänk
            name: button_link
            widget: string
            required: false
            hint: "Exempel: #meny eller en full https-länk."

      - name: events
        label: Sport & event
        file: content/events.json
        format: json
        fields:
          - label: Visa sektionen
            name: visible
            widget: boolean
            default: true
          - label: Event
            name: events
            widget: list
            max: 6
            fields:
              - { label: Typ, name: type, widget: string, hint: "Exempel: SPORT, QUIZ eller LIVEMUSIK" }
              - { label: Datum, name: date, widget: string }
              - { label: Rubrik, name: title, widget: string }
              - { label: Beskrivning, name: text, widget: text }
              - { label: Tid, name: time, widget: string }
              - { label: Liten text, name: note, widget: string, required: false }
