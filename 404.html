<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#17130f">
  <title>Sidan hittades inte – Taco del Búho</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@500;700;800;900&display=swap">
  <style>
    :root{--orange:#f05a18;--yellow:#f6ad18;--ink:#17130f;--cream:#fff4d8}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;overflow:hidden;background:var(--ink);color:var(--cream);font-family:Montserrat,sans-serif}
    body:before,body:after{content:"";position:fixed;border-radius:50%;filter:blur(8px);pointer-events:none}
    body:before{width:460px;height:460px;right:-140px;top:-180px;background:radial-gradient(circle,rgba(246,173,24,.22),transparent 68%)}
    body:after{width:520px;height:520px;left:-240px;bottom:-260px;background:radial-gradient(circle,rgba(240,90,24,.2),transparent 70%)}
    main{position:relative;width:min(760px,calc(100% - 32px));padding:clamp(32px,7vw,74px);text-align:center;border:1px solid rgba(255,255,255,.12);border-radius:32px;background:rgba(27,21,17,.9);box-shadow:0 30px 90px rgba(0,0,0,.38)}
    img{width:92px;height:92px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 10px rgba(246,173,24,.08)}
    .eyebrow{margin:24px 0 8px;color:var(--yellow);font-size:.7rem;font-weight:900;letter-spacing:.2em}
    h1{margin:0;font:clamp(5.5rem,22vw,11rem)/.8 Anton,sans-serif;letter-spacing:.02em;color:#fff}
    h2{margin:28px 0 12px;font:clamp(2.1rem,8vw,4rem)/.95 Anton,sans-serif}
    p{max-width:520px;margin:0 auto;color:#d9cfbc;line-height:1.7}
    nav{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:30px}
    a{display:inline-flex;min-height:52px;align-items:center;justify-content:center;padding:0 22px;border:1px solid rgba(255,255,255,.35);border-radius:999px;color:#fff;text-decoration:none;font-weight:900;transition:transform .2s ease,filter .2s ease}
    a:first-child{border-color:var(--orange);background:var(--orange)}
    a:hover{transform:translateY(-2px);filter:brightness(1.08)}
    :focus-visible{outline:3px solid var(--yellow);outline-offset:4px}
    @media(max-width:520px){main{padding:36px 20px;border-radius:24px}nav{display:grid}a{width:100%}}
    @media(prefers-reduced-motion:reduce){a{transition:none}}
  </style>
</head>
<body>
  <main>
    <img src="/assets/logo-512.webp" alt="Taco del Búho" width="92" height="92">
    <p class="eyebrow">OJ, FEL VÄG</p>
    <h1>404</h1>
    <h2>HÄR FINNS INGA TACOS.</h2>
    <p>Sidan du letar efter kan ha flyttats. Vi hjälper dig tillbaka till maten, menyn och bokningen.</p>
    <nav aria-label="Gå vidare">
      <a href="/">TILL STARTSIDAN</a>
      <a href="/#meny">SE MENYN</a>
      <a href="/#boka">BOKA BORD</a>
    </nav>
  </main>
</body>
</html>
